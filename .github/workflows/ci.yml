name: CylinderSense CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cs_dev
          POSTGRES_PASSWORD: cs_dev_pass
          POSTGRES_DB: cylindersense
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run Clippy Linter (cargo clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Run Workspace Tests (cargo test)
        env:
          DATABASE_URL: postgres://cs_dev:cs_dev_pass@localhost:5432/cylindersense
        run: cargo test --workspace
