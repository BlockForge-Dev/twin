name: CylinderSense CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://cs_dev:cs_dev_pass@127.0.0.1:5432/cylindersense

jobs:
  check-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cs_dev
          POSTGRES_PASSWORD: cs_dev_pass
          POSTGRES_DB: cylindersense
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Wait for PostgreSQL
        run: |
          until docker exec ${{ job.services.postgres.id }} pg_isready -U cs_dev; do
            echo "Waiting for PostgreSQL to accept connections..."
            sleep 1
          done

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run Clippy Linter (cargo clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Run Workspace Tests (cargo test)
        run: cargo test --workspace
